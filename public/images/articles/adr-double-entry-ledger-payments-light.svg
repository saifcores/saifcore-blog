<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-hidden="true" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="haloBlue">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloGreen">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(15,23,42,0.05)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <ellipse cx="180" cy="90" rx="380" ry="300" fill="url(#haloBlue)"/>
  <ellipse cx="1030" cy="600" rx="420" ry="320" fill="url(#haloGreen)"/>
  
  <g filter="url(#glow)">
    <rect x="340" y="180" width="220" height="300" rx="12" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="2"/>
    <rect x="640" y="180" width="220" height="300" rx="12" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
    
    
    <line x1="380" y1="280" x2="520" y2="280" stroke="rgba(15,23,42,0.22)" stroke-width="2"/>
    <line x1="380" y1="330" x2="500" y2="330" stroke="rgba(15,23,42,0.18)" stroke-width="2"/>
    <line x1="680" y1="280" x2="820" y2="280" stroke="rgba(15,23,42,0.22)" stroke-width="2"/>
    <line x1="680" y1="330" x2="800" y2="330" stroke="rgba(15,23,42,0.18)" stroke-width="2"/>
    
  </g>
  <g>
    <text x="450" y="230" text-anchor="middle" fill="#1d4ed8" font-size="22" font-weight="700">DEBIT</text>
    <text x="750" y="230" text-anchor="middle" fill="#059669" font-size="22" font-weight="700">CREDIT</text>
    <text x="600" y="520" text-anchor="middle" fill="#475569" font-size="16">APPEND-ONLY JOURNAL</text>
  </g>
  <rect x="48" y="600" width="26" height="3" rx="1.5" fill="url(#brand)"/>
  <text x="48" y="632" fill="rgba(15,23,42,0.4)" font-size="13" font-weight="700" letter-spacing="0.22em">SAIFCORE</text>
</svg>