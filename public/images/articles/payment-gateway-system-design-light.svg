    <rect x="360" y="250" width="140" height="70" rx="12" fill="rgba(37,99,235,0.22)" stroke="#2563eb" stroke-width="2"/>
    
    <rect x="580" y="250" width="140" height="70" rx="12" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="2"/>
    
    <rect x="800" y="250" width="200" height="70" rx="12" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2"/>
    
    <path d="M280 285 H360 M500 285 H580 M720 285 H800" stroke="url(#brand)" stroke-width="3"/>
    <rect x="400" y="400" width="400" height="64" rx="12" fill="rgba(37,99,235,0.15)" stroke="url(#brand)" stroke-width="2"/>
    
    
    
  </g>
  <g>
    <text x="210" y="292" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">AUTH</text>
    <text x="430" y="292" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">CAPTURE</text>
    <text x="650" y="292" text-anchor="middle" fill="#047857" font-size="14" font-weight="700">SETTLE</text>
    <text x="900" y="292" text-anchor="middle" fill="#b45309" font-size="14" font-weight="700">PAYOUT</text>
    <text x="600" y="440" text-anchor="middle" fill="#1d4ed8" font-family="ui-monospace,monospace" font-size="16">LEDGER Σ = 0</text>
    <text x="600" y="180" text-anchor="middle" fill="#475569" font-size="14">CARD → NETWORK → ACQUIRER → MERCHANT</text>
