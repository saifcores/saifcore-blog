<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-hidden="true" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="haloBlue">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloGreen">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(15,23,42,0.05)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <ellipse cx="180" cy="90" rx="380" ry="300" fill="url(#haloBlue)"/>
  <ellipse cx="1030" cy="600" rx="420" ry="320" fill="url(#haloGreen)"/>
  
  <g filter="url(#glow)">
    <rect x="380" y="150" width="440" height="380" rx="16" fill="rgba(15,23,42,0.04)" stroke="url(#brand)" stroke-width="2"/>
    
    
    <line x1="420" y1="290" x2="760" y2="290" stroke="rgba(15,23,42,0.18)" stroke-width="2"/>
    
    <line x1="420" y1="360" x2="760" y2="360" stroke="rgba(15,23,42,0.18)" stroke-width="2"/>
    
    <line x1="420" y1="430" x2="720" y2="430" stroke="rgba(15,23,42,0.18)" stroke-width="2"/>
    <circle cx="760" cy="470" r="28" fill="rgba(16,185,129,0.3)" stroke="#10b981" stroke-width="2"/>
    <path d="M748 470 L756 478 L774 458" stroke="#059669" stroke-width="3" fill="none"/>
  </g>
  <g>
    <text x="420" y="210" fill="#f59e0b" font-size="28" font-weight="700">ADR</text>
    <text x="420" y="270" fill="#475569" font-size="16">Context</text>
    <text x="420" y="340" fill="#475569" font-size="16">Decision</text>
